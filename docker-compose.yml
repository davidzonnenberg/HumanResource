services:
  human-resource:
    build: .
    image: human-resource:latest
    container_name: human-resource
    restart: unless-stopped
    ports:
      - "3003:8080"
    environment:
      PORT: "8080"
      DATA_DIR: /data
      WEB_DIR: /app/web
      MAX_SAVE_BYTES: "5242880"
    volumes:
      - hr-data:/data

volumes:
  hr-data:
