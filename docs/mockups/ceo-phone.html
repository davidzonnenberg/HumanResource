<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Human Resource – CEO Phone mockup</title>
<!--
  REFERENCE MOCKUP ONLY. Not production code.
  - Visual + navigation reference for the CEO Phone (see .kiro/steering/phone-ui.md).
  - All text, numbers, names and quests are placeholders.
  - The real implementation is React components in apps/web, text via t('phone.*'),
    data via simBridge/useHud selectors, and Commands via panelActions.ts.
  Open this file directly in a browser to click through it.
-->
<style>
body{margin:0;background:#2b2b30}
#hrp{font-family:system-ui,Roboto,sans-serif}
#hrp *{box-sizing:border-box}
#hrp .wrap{display:flex;justify-content:center;padding:12px}
#hrp .ph{width:min(100%,350px);height:700px;border-radius:42px;background:#0d0d0f;padding:10px;box-shadow:0 12px 34px rgba(0,0,0,.4)}
#hrp .sc{position:relative;height:100%;border-radius:32px;overflow:hidden;display:flex;flex-direction:column;background:var(--bg);color:var(--fg)}
#hrp .light{--bg:#f6f2fb;--fg:#1c1b1f;--card:#fff;--mut:#6b6875;--acc:#d9480f;--chip:#ece6f3}
#hrp .dark{--bg:#121116;--fg:#ece9f1;--card:#1f1d25;--mut:#a7a2b3;--acc:#ff8a3d;--chip:#2c2934}
#hrp .fs-Small{font-size:13px}
#hrp .fs-Normal{font-size:14px}
#hrp .fs-Large{font-size:16px}
#hrp .sb{display:flex;justify-content:space-between;align-items:center;padding:8px 20px 4px;font-size:12px;border:0;background:var(--bg);color:inherit;width:100%;cursor:pointer;min-height:30px;position:relative;z-index:7}
#hrp .ph-cam{width:10px;height:10px;border-radius:50%;background:#000}
#hrp .mn{flex:1;overflow:hidden;position:relative}
#hrp .hm{height:100%;overflow:auto;display:flex;flex-direction:column;background:linear-gradient(160deg,#ff9a3d,#7b4dff);color:#fff}
#hrp .dark .hm{background:linear-gradient(160deg,#6b3200,#2b1a66)}
#hrp .wg{margin:8px 14px;padding:12px 14px;border-radius:22px;background:rgba(255,255,255,.2);color:#fff;border:0;text-align:left;font:inherit;display:block;width:calc(100% - 28px)}
#hrp button.wg{cursor:pointer}
#hrp .gr{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 4px;padding:10px 12px}
#hrp .ap{display:flex;flex-direction:column;align-items:center;gap:4px;background:none;border:0;color:#fff;font:inherit;font-size:11px;min-height:64px;cursor:pointer;padding:2px}
#hrp .ic{width:50px;height:50px;border-radius:17px;display:grid;place-items:center;font-size:24px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,.2)}
#hrp .bd{position:absolute;top:-4px;right:-4px;background:#e03131;color:#fff;font-size:10px;border-radius:9px;min-width:18px;height:18px;display:grid;place-items:center}
#hrp .dk{margin:auto 12px 8px;padding:8px;border-radius:28px;background:rgba(255,255,255,.22);display:flex;justify-content:space-around}
#hrp .ap2{height:100%;display:flex;flex-direction:column}
#hrp .tb{display:flex;align-items:center;gap:6px;padding:4px 8px}
#hrp .ib{min-width:44px;height:44px;border-radius:22px;border:0;background:none;color:inherit;font-size:18px;cursor:pointer}
#hrp .ib:hover{background:var(--chip)}
#hrp .ttl{font-size:20px;font-weight:600;flex:1}
#hrp .bdy{flex:1;overflow:auto;padding-bottom:10px}
#hrp .cd{background:var(--card);border-radius:18px;padding:12px 14px;margin:8px 12px;display:block;width:calc(100% - 24px);border:0;color:inherit;font:inherit;text-align:left}
#hrp button.cd{cursor:pointer}
#hrp .row{display:flex;justify-content:space-between;align-items:center;min-height:44px;gap:8px}
#hrp .mut{color:var(--mut);font-size:.85em}
#hrp .hd{font-size:.8em;color:var(--acc);font-weight:700;margin:14px 18px 2px;text-transform:uppercase;letter-spacing:.05em}
#hrp .bar{height:8px;border-radius:4px;background:var(--chip);overflow:hidden;margin:4px 0 8px}
#hrp .bar>i{display:block;height:100%;background:var(--acc)}
#hrp .seg{display:flex;background:var(--chip);border-radius:22px;padding:3px;margin:6px 0}
#hrp .seg button{flex:1;min-height:38px;border:0;border-radius:20px;background:none;color:inherit;cursor:pointer;font:inherit;font-size:.9em}
#hrp .seg .on{background:var(--acc);color:#fff}
#hrp .btn{min-height:44px;padding:0 14px;border-radius:22px;border:0;background:var(--acc);color:#fff;font:inherit;font-weight:600;cursor:pointer;white-space:nowrap}
#hrp .btn.tn{background:var(--chip);color:var(--fg)}
#hrp .sw{width:52px;height:32px;border-radius:16px;background:var(--chip);border:2px solid var(--mut);position:relative;cursor:pointer;padding:0;flex:none}
#hrp .sw::after{content:'';position:absolute;top:4px;left:4px;width:20px;height:20px;border-radius:50%;background:var(--mut);transition:left .2s}
#hrp .sw.on{background:var(--acc);border-color:var(--acc)}
#hrp .sw.on::after{left:24px;background:#fff}
#hrp .bt{display:flex;background:var(--card);border-top:1px solid var(--chip)}
#hrp .bt button{flex:1;min-height:58px;border:0;background:none;color:var(--mut);font:inherit;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
#hrp .bt .on{color:var(--fg);font-weight:600}
#hrp .bt .on span{background:var(--chip);border-radius:14px}
#hrp .bt span{padding:3px 18px;font-size:16px}
#hrp .sh{position:absolute;left:0;right:0;top:0;bottom:0;background:var(--bg);z-index:6;padding:40px 12px 12px;overflow:auto;transform:translateY(-102%);transition:transform .25s;visibility:hidden}
#hrp .sh.op{transform:none;visibility:visible}
#hrp .tg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#hrp .tl{min-height:56px;border-radius:20px;border:0;background:var(--chip);color:var(--fg);text-align:left;padding:0 14px;font:inherit;cursor:pointer}
#hrp .tl.on{background:var(--acc);color:#fff}
#hrp .nb{display:flex;justify-content:space-around;padding:2px 0 6px;background:var(--bg);position:relative;z-index:7}
#hrp .nb button{width:64px;height:44px;border:0;background:none;color:var(--fg);font-size:16px;cursor:pointer;border-radius:22px}
#hrp .ts{position:absolute;bottom:62px;left:50%;transform:translateX(-50%);background:#323232;color:#fff;padding:10px 14px;border-radius:12px;font-size:13px;z-index:8;opacity:0;transition:opacity .2s;pointer-events:none;width:max-content;max-width:85%}
#hrp .ts.v{opacity:1}
#hrp .mapg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 12px;padding:10px;border-radius:18px;background:repeating-linear-gradient(90deg,var(--chip) 0 2px,transparent 2px 40px),var(--card)}
#hrp .mapg button{min-height:56px;border-radius:14px;border:2px solid transparent;background:var(--bg);color:inherit;font-size:22px;cursor:pointer}
#hrp .mapg .on{border-color:var(--acc)}
#hrp input[type=range]{width:100%;accent-color:var(--acc);min-height:32px}
#hrp .rc{margin:10px 14px;padding:16px;border-radius:22px;background:var(--card);border:0;color:inherit;font:inherit;width:calc(100% - 28px);text-align:left;cursor:pointer;display:flex;gap:12px;align-items:center}
#hrp button:focus-visible,#hrp input:focus-visible{outline:3px solid #4dabf7;outline-offset:2px}
</style>
</head>
<body>
<div id="hrp">
  <div class="wrap">
    <div class="ph">
      <div class="sc light fs-Normal">
        <button type="button" class="sb" data-act="shade" aria-label="Toggle notification shade">
          <span class="sbt">14:20 · Day 3</span><span class="ph-cam"></span><span class="sbi">📶 🔋82%</span>
        </button>
        <div class="mn" aria-live="polite"></div>
        <div class="shw"></div>
        <div class="ts" role="status"></div>
        <nav class="nb">
          <button type="button" data-act="back" aria-label="Back">◀</button>
          <button type="button" data-act="home" aria-label="Home">●</button>
          <button type="button" data-act="rec" aria-label="Recent apps">■</button>
        </nav>
      </div>
    </div>
  </div>
</div>
<script>
(function(){
const R=document.getElementById('hrp');
const $=s=>R.querySelector(s);

// ---- Session state (in the real game: phoneStore + profile settings, NOT SimState) ----
const S={stack:['home'],tab:{},dark:!!(window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches),
  dnd:false,shade:false,price:450,pace:'Normal',open:true,vol:70,hap:true,joy:'Left',txt:'Normal',
  quest:true,auto:true,reo:4,layer:'Demand',sel:'Supplier',vote:'',recents:[]};

// ---- App registry (in the real game: packages/content/data/ui/apps.json, reveal-gated) ----
const A=[
 {id:'todo',n:'To-Do™',i:'📋',c:'#2f9e44',b:1},
 {id:'map',n:'Wayfindr',i:'🗺️',c:'#1c7ed6'},
 {id:'pint',n:'Pintly',i:'🍺',c:'#f08c00',b:2},
 {id:'ledgr',n:'Ledgr',i:'💰',c:'#5f3dc4'},
 {id:'staff',n:'Staffly',i:'👥',c:'#c2255c'},
 {id:'van',n:'Vanly',i:'🚐',c:'#0b7285'},
 {id:'news',n:'LinkedOut',i:'📰',c:'#364fc7',b:3},
 {id:'gem',n:'MijnGemeente',i:'🏛️',c:'#495057'},
 {id:'set',n:'Settings',i:'⚙️',c:'#868e96'}];
const DOCK=['todo','map','ledgr','set'];
const T={todo:['Main','Side','Requests'],pint:['Status','Dials','Visit'],ledgr:['Overview','Loan']};
const TI={Main:'⭐',Side:'🧩',Requests:'📨',Status:'📊',Dials:'🎛️',Visit:'📍',Overview:'📈',Loan:'🏦'};
const N=[
 {a:'pint',t:'Pintly',m:'Cosy Local: 4 waiting. Hands is the bottleneck.'},
 {a:'staff',t:'Staffly',m:'Julia: can we talk about Hustle mode?'},
 {a:'todo',t:'To-Do™',m:'Next step: sign the supply deal at the Supplier.'}];
const BL=[
 {n:'Cosy Local',i:'🍺',s:'Your pub · settings, fit-out'},
 {n:'Municipality',i:'🏛️',s:'Licenses, permits, plots'},
 {n:'Bank',i:'🏦',s:'Loans, refinancing'},
 {n:'Supplier',i:'📦',s:'Supply deals, kegs'},
 {n:'Job centre',i:'💼',s:'Interviews, hiring'},
 {n:'Sports pub',i:'⚽',s:'Rival · inspect only'}];

// ---- UI primitives (real game: Card/Row/Bar/PanelButton + new Switch/Segmented/DriveThereButton) ----
const fmt=g=>(g/100).toFixed(2); // Gold is integer hundredths
const row=(l,r)=>`<div class='row'><span>${l}</span><span>${r}</span></div>`;
const bar=(p,red)=>`<div class='bar'><i style='width:${p}%;${red?'background:#e03131':''}'></i></div>`;
const drv=to=>`<button type='button' class='btn tn' data-act='drive' data-to='${to}'>📍 Drive there</button>`;
const sw=(k,l)=>`<button type='button' role='switch' aria-checked='${!!S[k]}' aria-label='${l}' class='sw ${S[k]?'on':''}' data-act='tog' data-k='${k}'></button>`;
const seg=(k,o)=>`<div class='seg' role='group'>${o.map(v=>`<button type='button' aria-pressed='${S[k]===v}' class='${S[k]===v?'on':''}' data-act='seg' data-k='${k}' data-v='${v}'>${v}</button>`).join('')}</div>`;
const rng=(k,min,max,l)=>`<label class='row'><span>${l}</span><b data-o='${k}'>${S[k]}</b></label><input type='range' min='${min}' max='${max}' value='${S[k]}' data-k='${k}' aria-label='${l}'>`;
const ico=(a,nl)=>`<button type='button' class='ap' data-act='open' data-a='${a.id}' aria-label='${a.n}'><span class='ic' style='background:${a.c}'>${a.i}${a.b?`<span class='bd'>${a.b}</span>`:''}</span>${nl?'':`<span>${a.n}</span>`}</button>`;

// ---- Home screen ----
function home(){return `<div class='hm'>
<div class='wg'><div style='font-size:42px;font-weight:300;line-height:1'>14:20</div><div>Day 3 · Old Town · ☀️ 17°</div></div>
<button type='button' class='wg' data-act='open' data-a='ledgr'><b>💰 ${fmt(124000)}</b> &nbsp;▲ +86/h<div style='opacity:.8;font-size:.85em'>Loan −3,000.00 · runway healthy</div></button>
<button type='button' class='wg' data-act='open' data-a='todo'><b>📋 Grand Opening 3/6</b><div style='opacity:.85;font-size:.9em'>→ Sign supply deal at the Supplier</div></button>
<div class='gr'>${A.filter(a=>!DOCK.includes(a.id)).map(a=>ico(a)).join('')}</div>
<div class='dk'>${DOCK.map(id=>ico(A.find(a=>a.id===id),true)).join('')}</div></div>`}

// ---- App bodies ----
const B={
todo:t=>t==='Main'?`<div class='cd'><div class='row'><b>Grand Opening</b><span class='mut'>3/6</span></div>${bar(50)}${row('✅ Liquor license','')}${row('✅ Starter loan','')}${row('✅ Pub fit-out','')}<div class='row'><span>⬜ Sign supply deal</span>${drv('Supplier')}</div><div class='row'><span>⬜ Hire a Bar Worker</span>${drv('Job centre')}</div><div class='row'><span>🔒 Cut the ribbon</span><span class='mut'>after the above</span></div></div><div class='cd'><b>Up next</b><div class='mut'>First 100 pints · Second location</div></div>`
 :t==='Side'?`<div class='cd'><b>🎉 Football club catering</b><div class='mut'>Deliver 8 kegs before 18:00 · reward 250.00</div><div class='row'><span class='mut'>⏱ 3h 40m left</span>${drv('Football club')}</div></div><div class='cd'><b>🪑 Town favour</b><div class='mut'>Bring chairs to the town square · +2 Favour</div><div class='row'><span></span>${drv('Town square')}</div></div>`
 :`<div class='cd'><b>📨 Noise complaint</b><div class='mut'>The municipality wants a word. Ignoring this may have consequences.</div><div class='row'><span class='mut'>Due: Day 4</span>${drv('Municipality')}</div></div>`,
map:()=>`<div style='padding:0 12px'>${seg('layer',['Demand','Stock','Staff','Money'])}</div><div class='mapg'>${BL.map(b=>`<button type='button' class='${S.sel===b.n?'on':''}' data-act='seg' data-k='sel' data-v='${b.n}' aria-label='${b.n}'>${b.i}</button>`).join('')}</div>${(b=>`<div class='cd'><b>${b.i} ${b.n}</b><div class='mut'>${b.s}</div><div class='mut'>Layer: ${S.layer}</div><div class='row'><span></span>${drv(b.n)}</div></div>`)(BL.find(b=>b.n===S.sel))}`,
pint:t=>t==='Status'?`<div class='cd'><div class='row'><b>🍺 Cosy Local</b><span>${S.open?'Open':'Closed'} ${sw('open','Pub open')}</span></div>${row('Seats','12 / 16')}${bar(75)}${row('Taps','2 / 2')}${bar(60)}${row('<b style=color:#e03131>Hands ⚠ bottleneck</b>','1 / 1')}${bar(100,true)}</div><div class='cd'>${row('Waiting','4')}${row('Lost per hour','3')}${row('Vibe','😊 Cosy')}<div class='row'><span class='mut'>Hire more hands?</span><button type='button' class='btn' data-act='open' data-a='staff'>Open Staffly</button></div></div>`
 :t==='Dials'?`<div class='cd'><div class='row'><span>Pint price</span><span><button type='button' class='ib' data-act='price' data-d='-25' aria-label='Lower price'>−</button><b>${fmt(S.price)}</b><button type='button' class='ib' data-act='price' data-d='25' aria-label='Raise price'>+</button></span></div><div class='mut'>${S.price>550?'Students are complaining.':S.price<350?'Regulars love you. Your margin does not.':'Customers seem fine.'}</div></div><div class='cd'><div>Worker pace</div>${seg('pace',['Relaxed','Normal','Hustle'])}<div class='mut'>${S.pace==='Hustle'?'Faster service, morale drains.':S.pace==='Relaxed'?'Happy staff, slower pints.':'Balanced.'}</div></div><div class='cd'>${rng('reo',1,10,'Auto-reorder below (kegs)')}</div>`
 :`<div class='cd'><div class='mut'>These changes need your signature in person.</div><div class='row'><span>Service style<div class='mut'>Counter</div></span>${drv('Cosy Local')}</div><div class='row'><span>Fit-out<div class='mut'>4 tables, 2 taps</div></span>${drv('Cosy Local')}</div><div class='row'><span>License tier<div class='mut'>Pub</div></span>${drv('Municipality')}</div></div>`,
ledgr:t=>t==='Overview'?`<div class='cd'><div class='mut'>Gold per hour</div><div style='font-size:2em;font-weight:700;color:#2f9e44'>+86.00</div><div class='mut'>Previous hour +61.00</div><svg viewBox='0 0 180 44' width='100%' height='60' aria-label='Gold trend, rising'><polyline points='0,40 20,36 40,38 60,28 80,30 100,21 120,23 140,13 160,15 180,6' fill='none' stroke='var(--acc)' stroke-width='3' stroke-linejoin='round'/></svg></div><div class='cd'>${row('Sales','<b style=color:#2f9e44>+142.00/h</b>')}${row('Wages','−38.00/h')}${row('Supply','−12.00/h')}${row('Loan','−6.00/h')}</div>`
 :`<div class='cd'><b>🏦 Ambitious loan</b>${row('Remaining','3,000.00')}${bar(25)}${row('Next payment','60.00 · Day 4')}${row('Interest','6%')}<div class='row'><span class='mut'>Pay off early</span>${drv('Bank')}</div></div>`,
staff:()=>[['Jan','Bar Worker','Hums while pouring',80,'12.00/h'],['Thomas','Driver','Takes the scenic route past the bakery',65,'11.00/h']].map(h=>`<div class='cd'><div class='row'><b>${h[0]}</b><span class='mut'>${h[1]}</span></div><div class='mut'>“${h[2]}”</div>${row('Morale',h[3]+'%')}${bar(h[3],h[3]<50)}${row('Pay',h[4])}</div>`).join('')+`<div class='cd'><div class='row'><b>Julia</b><span class='mut'>Candidate</span></div><div class='mut'>“Passionate about synergy”</div><div class='row'><span>Interview</span>${drv('Job centre')}</div></div>`,
van:()=>`<div class='cd'><div class='row'><b>🚐 Van 1</b><span class='mut'>Thomas driving</span></div>${row('Route','Supplier → Cosy Local')}${row('Cargo','6 / 12 kegs')}${bar(50)}<div class='row'><span>Take the wheel</span>${drv('Van 1')}</div></div><div class='cd'>${row('Open orders','1 · 6 kegs')}${row('Cellar stock','3 kegs')}</div>`,
news:()=>[['Cosy Local CEO','Humbled to announce our second keg. Grateful for this journey. #synergy','2m'],['Sports pub','Tonight: derby on the big screen. Cheap pints.','1h'],['Municipality','Reminder: terrace permits now open for applications.','3h']].map(p=>`<div class='cd'><div class='row'><b>${p[0]}</b><span class='mut'>${p[2]}</span></div><div>${p[1]}</div><div class='mut'>👍 12 · 💬 3</div></div>`).join(''),
gem:()=>`<div class='hd'>Permits</div><div class='cd'><div class='row'><span>☂️ Terrace permit<div class='mut'>+6 seats · 40.00/day</div></span>${drv('Municipality')}</div><div class='row'><span>🌙 Late licence<div class='mut'>New customer types</div></span>${drv('Municipality')}</div></div><div class='hd'>Council vote · Day 5</div><div class='cd'><b>Car-free main street?</b><div class='mut'>Lobbying costs Favour.</div>${seg('vote',['Support','Oppose'])}</div>`,
set:()=>`<div class='hd'>Display</div><div class='cd'><div class='row'><span>Dark mode</span>${sw('dark','Dark mode')}</div><div>Text size</div>${seg('txt',['Small','Normal','Large'])}</div><div class='hd'>Sound</div><div class='cd'>${rng('vol',0,100,'Volume')}</div><div class='hd'>Notifications</div><div class='cd'><div class='row'><span>Do Not Disturb<div class='mut'>Hides side quests and pings</div></span>${sw('dnd','Do Not Disturb')}</div><div class='row'><span>Quest pings</span>${sw('quest','Quest pings')}</div></div><div class='hd'>Controls</div><div class='cd'><div>Joystick side</div>${seg('joy',['Left','Right'])}<div class='row'><span>Haptics</span>${sw('hap','Haptics')}</div></div><div class='hd'>Game</div><div class='cd'><div class='row'><span>Autosave</span>${sw('auto','Autosave')}</div>${row('Save slot','Slot 1 · synced ✓')}${row('Profile','David · PIN on')}</div><div class='hd'>About</div><div class='cd'>${row('Human Resource','v0.2')}<div class='mut'>CEO Phone OS · battery is decorative</div></div>`
};

// ---- App shell: top bar + body + optional bottom tabs ----
function app(id){const a=A.find(x=>x.id===id);const tabs=T[id];const tab=S.tab[id]||(tabs?tabs[0]:'');
return `<div class='ap2'><div class='tb'><button type='button' class='ib' data-act='back' aria-label='Back'>←</button><span class='ttl'>${a.n}</span><button type='button' class='ib' data-act='toast' data-m='Search is a placeholder' aria-label='Search'>🔍</button></div><div class='bdy'>${B[id](tab)}</div>${tabs?`<nav class='bt'>${tabs.map(v=>`<button type='button' class='${v===tab?'on':''}' aria-current='${v===tab}' data-act='tab' data-a='${id}' data-v='${v}'><span>${TI[v]}</span>${v}</button>`).join('')}</nav>`:''}</div>`}

function rec(){return `<div class='ap2'><div class='tb'><span class='ttl' style='padding-left:10px'>Recent apps</span></div><div class='bdy'>${S.recents.length?S.recents.map(id=>{const a=A.find(x=>x.id===id);return `<button type='button' class='rc' data-act='open' data-a='${id}'><span class='ic' style='background:${a.c}'>${a.i}</span><b>${a.n}</b></button>`}).join(''):`<div class='cd mut'>No recent apps yet.</div>`}</div></div>`}

function shade(){const tl=(k,l)=>`<button type='button' class='tl ${S[k]?'on':''}' aria-pressed='${!!S[k]}' data-act='tog' data-k='${k}'>${l}</button>`;
return `<div class='sh ${S.shade?'op':''}' aria-hidden='${!S.shade}'><div class='tg'>${tl('dnd','🔕 Do Not Disturb')}${tl('dark','🌙 Dark mode')}${tl('hap','📳 Haptics')}<button type='button' class='tl' data-act='open' data-a='set'>⚙️ Settings</button></div><div class='hd'>Notifications</div>${S.dnd?`<div class='cd mut'>Silenced. Alerts still appear on the bell.</div>`:N.map(n=>`<button type='button' class='cd' data-act='open' data-a='${n.a}'><b>${n.t}</b><div class='mut'>${n.m}</div></button>`).join('')}<div style='text-align:center;margin-top:10px'><button type='button' class='btn tn' data-act='shade'>Close</button></div></div>`}

function render(){const top=S.stack[S.stack.length-1];
$('.sc').className='sc '+(S.dark?'dark':'light')+' fs-'+S.txt;
$('.mn').innerHTML=top==='home'?home():top==='rec'?rec():app(top);
$('.shw').innerHTML=shade();
$('.sbi').textContent=(S.dnd?'🔕 ':'')+'📶 🔋82%'}

let tt=0;function toast(m){const t=$('.ts');t.textContent=m;t.classList.add('v');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('v'),2000)}

// ---- Navigation (real game: phoneStore actions) ----
R.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||!R.contains(el))return;const d=el.dataset;const top=S.stack[S.stack.length-1];
switch(d.act){
 case 'open':{S.shade=false;if(top!==d.a)S.stack.push(d.a);if(S.stack.length>12)S.stack=['home'].concat(S.stack.slice(-6));S.recents=[d.a].concat(S.recents.filter(x=>x!==d.a)).slice(0,5);const a=A.find(x=>x.id===d.a);if(a)a.b=0;break}
 case 'back':if(S.shade)S.shade=false;else if(S.stack.length>1)S.stack.pop();break;
 case 'home':S.shade=false;S.stack=['home'];break;
 case 'rec':S.shade=false;if(top!=='rec')S.stack.push('rec');break;
 case 'shade':S.shade=!S.shade;break;
 case 'tab':S.tab[d.a]=d.v;break;
 case 'tog':S[d.k]=!S[d.k];break;
 case 'seg':S[d.k]=d.v;break;
 case 'price':S.price=Math.min(900,Math.max(200,S.price+(Number(d.d)||0)));break;
 case 'drive':S.shade=false;toast('📍 Waypoint set: '+d.to+'. Follow the road arrows.');break;
 case 'toast':toast(d.m||'');break}
render()});
R.addEventListener('input',e=>{const k=e.target&&e.target.dataset?e.target.dataset.k:null;if(!k)return;const v=Math.round(Number(e.target.value));S[k]=isFinite(v)?v:0;const o=R.querySelector(`[data-o='${k}']`);if(o)o.textContent=S[k]});
R.addEventListener('keydown',e=>{if(e.key==='Escape'){if(S.shade)S.shade=false;else if(S.stack.length>1)S.stack.pop();render()}});
render()})();
</script>
</body>
</html>
