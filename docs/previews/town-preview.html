function quadBezier(p0, c, p1, steps) {
    const out = [];
    for (let i = 1; i <= steps; i++) {
        const t = i / steps;
        const a = (1 - t) * (1 - t);
        const b = 2 * (1 - t) * t;
        const d = t * t;
        out.push([a * p0[0] + b * c[0] + d * p1[0], a * p0[1] + b * c[1] + d * p1[1]]);
    }
    return out;
}
/** right: points from (hw,0) up the right side, all with x > 0. apex: optional top point at x = 0. */
function mirrored(right, apex) {
    const left = right
        .slice()
        .reverse()
        .map(([x, y]) => [-x, y]);
    return apex ? [...right, apex, ...left] : [...right, ...left];
}
function gableLayout(kind, halfWidth, height) {

            return { outline: mirrored([[hw, 0]], [0, h]), finials: [[0, h]], caps: [], windowCentreY: h * 0.32, windowMaxWidth: hw * 0.7, ridgeHeight: h };
        case 'step': {
            const n = hw > 2.2 ? 4 : 3;
            const tw = Math.max(0.35, hw * 0.28);
            const sy = h / (n + 1);
            const sx = (hw - tw) / n;
            const right = [
                [hw, 0],
                [hw, sy],
            ];
            for (let i = 1; i <= n; i++) {
                const x = hw - i * sx;
                right.push([x, i * sy], [x, (i + 1) * sy]);
            }
            const caps = [];
            for (let i = 0; i < n; i++) {
                const x = hw - i * sx;
                caps.push([x, (i + 1) * sy], [-x, (i + 1) * sy]);
            }
            caps.push([0, h]);
            return { outline: mirrored(right, null), finials: [], caps, windowCentreY: sy * 1.4, windowMaxWidth: Math.min(hw * 0.9, (hw - sx) * 1.4), ridgeHeight: h * 0.97 };
        }
        case 'neck': {
            const nw = Math.max(0.4, hw * 0.38);
            const right = [[hw, 0], [hw, h * 0.1], ...quadBezier([hw, h * 0.1], [nw, h * 0.12], [nw, h * 0.5], 8), [nw, h * 0.82]];
            return {
                outline: mirrored(right, [0, h]),
                finials: [
                    [hw, h * 0.1],
                    [-hw, h * 0.1],
                    [0, h],
                ],
                caps: [],
                windowCentreY: h * 0.55,
                windowMaxWidth: nw * 1.5,
                ridgeHeight: h * 0.9,

                    [hw, h * 0.12],

/** Signed area; positive = counter-clockwise. */
function polygonArea(pts) {
    let a = 0;
    for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const q = pts[(i + 1) % pts.length];
        a += p[0] * q[1] - q[0] * p[1];
    }
    return a / 2;
}
/** Insert points so no edge of the closed polygon is longer than maxEdge (lets the warp bend it). */
function densifyPolygon(pts, maxEdge) {
    const out = [];
    for (let i = 0; i < pts.length; i++) {
        const p = pts[i];
        const q = pts[(i + 1) % pts.length];
        const n = Math.max(1, Math.ceil(Math.hypot(q[0] - p[0], q[1] - p[1]) / maxEdge));
        for (let k = 0; k < n; k++)
            out.push([p[0] + ((q[0] - p[0]) * k) / n, p[1] + ((q[1] - p[1]) * k) / n]);
    }
    return out;
}
/** Same as densifyPolygon, for an open path (keeps the last point, no closing edge). */
function densifyPath(pts, maxEdge) {
    const out = [];
    for (let i = 0; i < pts.length - 1; i++) {
        const p = pts[i];
        const q = pts[i + 1];
        const n = Math.max(1, Math.ceil(Math.hypot(q[0] - p[0], q[1] - p[1]) / maxEdge));
        for (let k = 0; k < n; k++)
            out.push([p[0] + ((q[0] - p[0]) * k) / n, p[1] + ((q[1] - p[1]) * k) / n]);
    }
    const last = pts[pts.length - 1];
    if (last)
        out.push([last[0], last[1]]);
    return out;
}
/** Grow a CCW polygon outward by `d` (mitre, clamped). Used for step-gable rims. */
function offsetPolygon(pts, d) {
    const src = polygonArea(pts) >= 0 ? pts.slice() : pts.slice().reverse();
    const n = src.length;
    const normal = (a, b) => {
        const dx = b[0] - a[0];
        const dy = b[1] - a[1];
        const len = Math.hypot(dx, dy) || 1;
        return [dy / len, -dx / len];
    };
    return src.map((p, i) => {
        const prev = src[(i - 1 + n) % n];
        const next = src[(i + 1) % n];
        const n1 = normal(prev, p);
        const n2 = normal(p, next);
        let mx = n1[0] + n2[0];
        let my = n1[1] + n2[1];
        const len = Math.hypot(mx, my) || 1;
        mx /= len;
        my /= len;
        const cos = Math.max(0.35, mx * n1[0] + my * n1[1]);
        return [p[0] + (mx * d) / cos, p[1] + (my * d) / cos];
    });

function addFlag(c, u, y, colours) {

    const d = [Math.sin(a), Math.cos(a)]; // along the pole (y, z)
    const e = [-Math.cos(a), Math.sin(a)]; // away from the pole, downward
    const tipY = y + d[0] * len;
    const tipZ = d[1] * len;
    const pole = new THREE.CylinderGeometry(0.025, 0.025, len, 8);
    pole.rotateX(Math.PI / 2 - a);
    pole.translate(u, y + (d[0] * len) / 2, tipZ / 2);

    c.ball('gloss', GOLD, 0.05, u, tipY, tipZ);
    const fw = 0.75;
    const fh = 0.5;
    c.mover('wave', 'flag', [u, tipY, tipZ], [0, d[0], d[1]], 0.3, 0.9, () => {
        colours.forEach((col, i) => {
            const sh = fh / colours.length;
            const along = 0.06 + fw / 2;
            const down = sh * (i + 0.5) + 0.03;
            c.slab('trim', col, 0.02, sh + 0.004, fw, u, tipY - d[0] * along + e[0] * down, tipZ - d[1] * along + e[1] * down, { rx: -a, r: 0.01, b: 0.006 }, { contact: false });
        });
    });
}

/** The € sign as extrudable shapes, centred at (0,0), height ~2R. */
function euroShapes(R) {
    const ring = new THREE.Shape();
    ring.absarc(0, 0, R, 0.75, Math.PI * 2 - 0.75, false);
    ring.absarc(0, 0, R * 0.7, Math.PI * 2 - 0.75, 0.75, true);
    ring.closePath();
    const bars = [0.2, -0.2].map((yy) => {
        const s = new THREE.Shape();
        const h = R * 0.15;
        const x0 = -R * 1.2;
        const x1 = R * 0.25;
        s.moveTo(x0, yy * R - h / 2);
        s.lineTo(x1, yy * R - h / 2);
        s.lineTo(x1 + h * 0.4, yy * R + h / 2);
        s.lineTo(x0 + h * 0.4, yy * R + h / 2);
        s.closePath();
        return s;
    });
    return [ring, ...bars];
}

function addEuroMedallion(c, u, y, R) {
    c.slab('trim', 'band', R * 1.5, 0.3, 0.5, u, y - R - 0.05, 0.2, { r: 0.08 });

    c.torus('gloss', c.shade(GOLD, -0.15), R, 0.06, 'z', u, y, 0.15);
    c.plate('gloss', c.shade(GOLD, 0.15), euroShapes(R * 0.62), 0.1, 0.2, 0.025, u + R * 0.08, y);
}

        c.cyl('trim', 'band', 0.17, colH, 'y', doorU + dx, base + 0.18 + colH / 2, 0.95, 0.04);
        c.slab('trim', 'band', 0.44, 0.16, 0.44, doorU + dx, base + 0.18 + colH + 0.08, 0.95, { r: 0.05 });
    }
    const beamY = base + 0.18 + colH + 0.32;
    c.slab('trim', 'band', 4.1, 0.42, 1.3, doorU, beamY, 0.85, { r: 0.08, b: 0.05 });
    c.slab('trim', 'trim', 4.3, 0.12, 1.42, doorU, beamY + 0.25, 0.86, { r: 0.05 });
    if (text) {
        c.slab('gloss', GOLD, 2.3, 0.3, 0.04, doorU, beamY, 1.51, { r: 0.04, b: 0.01 });
        c.signText(text, 2.1, 0.24, doorU, beamY, 1.535, '#3a2a22');
    }
}
/** Big 3D beer mug with foam (pub). */
function addBeerMug(c, u, y, z, s) {
    c.cyl('gloss', '#f2a531', 0.22 * s, 0.5 * s, 'y', u, y, z, 0.05 * s);
    c.cyl('trim', '#fff6e0', 0.235 * s, 0.06 * s, 'y', u, y - 0.2 * s, z, 0.02 * s);
    for (const [dx, dy, r] of [
        [-0.12, 0.27, 0.12],
        [0.02, 0.32, 0.14],
        [0.14, 0.27, 0.11],
        [0.06, 0.4, 0.1],
    ])
        c.ball('trim', '#fffaf0', r * s, u + dx * s, y + dy * s, z + 0.02 * s);
    c.ball('trim', '#fffaf0', 0.06 * s, u + 0.2 * s, y + 0.12 * s, z + 0.1 * s, 1.6);
    c.torus('gloss', '#f2a531', 0.13 * s, 0.04 * s, 'z', u + 0.26 * s, y, z);
    for (let i = 0; i < 5; i++)
        c.ball('gloss', '#ffe08a', 0.02 * s, u + (c.rng() - 0.5) * 0.25 * s, y + (c.rng() - 0.5) * 0.3 * s, z + 0.22 * s);
}
/** Hanging pub sign with a beer mug on both sides; swings. */
function addBeerSign(c, u, y, s) {
    c.slab('trim', IRON, 0.07, 0.07, 1.1 * s, u, y + 0.55 * s, 0.55 * s, { b: 0.02 });
    c.torus('trim', IRON, 0.13 * s, 0.03, 'x', u, y + 0.42 * s, 0.24 * s, Math.PI * 1.5);
    const bz = 0.7 * s;
    c.mover('swing', 'sign', [u, y + 0.55 * s, bz], [0, 0, 1], 0.06, 0.45, () => {
        c.cyl('trim', IRON, 0.012, 0.18 * s, 'y', u, y + 0.47 * s, bz - 0.28 * s, 0.005);
        c.cyl('trim', IRON, 0.012, 0.18 * s, 'y', u, y + 0.47 * s, bz + 0.28 * s, 0.005);
        c.slab('trim', 'accent', 0.1, 0.95 * s, 0.82 * s, u, y, bz, { r: 0.16 * s });
        c.slab('trim', 'trim', 0.13, 0.78 * s, 0.65 * s, u, y, bz, { r: 0.12 * s });
        for (const side of [-1, 1]) {
            const g = new THREE.Matrix4().makeTranslation(u + side * 0.09, 0, bz).multiply(new THREE.Matrix4().makeRotationY((side * Math.PI) / 2));
            c.inFrame(c.face.clone().multiply(g), () => addBeerMug(c, 0, y - 0.02 * s, 0, 0.62 * s));
        }
    });
}
/** Amsterdam-style shield: red, black band, three white crosses (municipality). */
function addCoatOfArms(c, u, y, s) {
    const sh = new THREE.Shape();
    const w = 0.42 * s;
    const h = 0.55 * s;
    sh.moveTo(-w, h * 0.5);
    sh.lineTo(w, h * 0.5);
    sh.lineTo(w, -h * 0.1);
    sh.quadraticCurveTo(w, -h * 0.6, 0, -h * 0.75);
    sh.quadraticCurveTo(-w, -h * 0.6, -w, -h * 0.1);
    sh.closePath();
    c.plate('gloss', GOLD, sh, 0.1, 0.05, 0.03, u, y);
    const inner = new THREE.Shape(sh.getPoints(12).map((p) => new THREE.Vector2(p.x * 0.86, p.y * 0.86)));
    c.plate('gloss', '#c0392b', inner, 0.06, 0.1, 0.02, u, y);
    c.slab('gloss', '#1f1f22', 0.22 * s, 0.98 * h, 0.04, u, y - 0.05 * s, 0.13, { b: 0.01, r: 0.02 });
    for (const dy of [0.2, 0, -0.2]) {
        for (const a of [0.78, -0.78])
            c.slab('gloss', '#ffffff', 0.17 * s, 0.045 * s, 0.03, u, y + dy * s - 0.03 * s, 0.16, { rz: a, b: 0.008 });
    }
    c.ball('gloss', GOLD, 0.08 * s, u, y + h * 0.62, 0.07);
}
/** Friendly logo: rounded triangle, an eye and a smile. (Synergy, later revealed as a cult.) */
function synergyLogo(c, u, y, s, z, paint) {
    const tri = new THREE.Shape();
    const k = s;
    tri.moveTo(0, k);
    tri.quadraticCurveTo(k * 0.15, k * 1.0, k * 0.9, -k * 0.45);
    tri.quadraticCurveTo(k * 0.95, -k * 0.6, k * 0.75, -k * 0.6);
    tri.lineTo(-k * 0.75, -k * 0.6);
    tri.quadraticCurveTo(-k * 0.95, -k * 0.6, -k * 0.9, -k * 0.45);
    tri.quadraticCurveTo(-k * 0.15, k * 1.0, 0, k);
    const ring = new THREE.Shape(tri.getPoints(8));
    ring.holes.push(new THREE.Path(tri.getPoints(8).map((p) => new THREE.Vector2(p.x * 0.78, p.y * 0.78 - k * 0.04))));
    c.plate('gloss', paint, ring, k * 0.25, z, k * 0.05, u, y);
    c.torus('gloss', paint, k * 0.2, k * 0.05, 'z', u, y + k * 0.02, z);
    c.ball('gloss', paint, k * 0.08, u, y + k * 0.02, z + k * 0.03, 1, 0.5);
    c.torus('gloss', paint, k * 0.22, k * 0.04, 'z', u, y - k * 0.08, z, Math.PI * 0.6, Math.PI * 1.2);
}
/** Neon coffee cup in the shop window; always glows (flicker mover). */
function addNeonCup(c, u, y, z) {
    c.mover('flicker', 'neon', [u, y, z], [0, 1, 0], 0, 3, () => {
        const pink = '#ff6fae';
        c.torus('lit', pink, 0.22, 0.03, 'z', u, y + 0.05, z, Math.PI, Math.PI);
        for (const s of [-1, 1])
            c.slab('lit', pink, 0.06, 0.28, 0.06, u + s * 0.22, y + 0.19, z, { r: 0.03, b: 0.01 });
        c.torus('lit', pink, 0.09, 0.03, 'z', u + 0.3, y + 0.16, z, Math.PI * 1.2, -Math.PI * 0.6);
        for (const dx of [-0.08, 0.08]) {
            c.torus('lit', '#9ae6ff', 0.06, 0.02, 'z', u + dx, y + 0.42, z, Math.PI, Math.PI / 2);
            c.torus('lit', '#9ae6ff', 0.06, 0.02, 'z', u + dx, y + 0.54, z, Math.PI, -Math.PI / 2);
        }
    });
}

/**
 * Builds a toy-style Dutch building from a recipe (v4).
 *
 * Look: soft clay parts, thick cream outlines, raised bricks and slates,
 * baked AO (ground + wall contact + undersides), a hand-made warp (lean,
 * bulge, ridge sag, taper), moulded tube rims on curved gables.
 * Character: archetype props, things in windows, one focal point per house,
 * clear identity markers for important buildings, weathering.
 * Output: up to eight merged geometries (one per material group), animated
 * movers (signs, flags, laundry, lamps) and smoke anchors.
 */
function buildBuilding(r, ownerHex, detail) {
    const W = r.width;
    const D = r.depth;
    const hw = W / 2;
    const eave = totalEaveHeight(r);
    const c = new Collector(r, ownerHex, detail, eave);
    const wall = c.wall;
    const P = r.props;
    const flat = r.gable.kind === 'flat';
    const modern = r.windows.style === 'modern';
    const floors = r.floorHeights.length;
    const floorBases = [];
    {
        let y = r.groundFloorHeight;
        for (const fh of r.floorHeights) {
            floorBases.push(y);
            y += fh;
        }
    }
    const sills = [];
    const pickLife = () => (r.windowLife.kinds.length && c.chance(r.windowLife.share) ? c.pick(r.windowLife.kinds) : null);
    const win = () => {
        const boarded = c.chance(r.boarded);
        return {
            style: r.windows.style,
            arch: r.windows.arch,
            shutters: r.windows.shutters,
            flower: !boarded && c.chance(r.windows.flowerBoxes),
            lit: !boarded && c.chance(r.litFraction),
            life: pickLife(),
            boarded,
        };
    };
    let door = null;
    const front = () => new THREE.Matrix4().makeTranslation(0, 0, D / 2);
    // ---------- body (building space) ----------
    const bodyR = Math.max(0.04, Math.min(r.bodyRadius, 0.3, W * 0.08));
    c.face.identity();
    c.slab(wall, 'brick', W, eave, D, 0, eave / 2, 0, { r: bodyR, b: bodyR, smooth: false, segments: 4 });
    c.slab('trim', 'ledge', W + 0.14, 0.42, D + 0.14, 0, 0.21, 0, { r: 0.08, b: Math.min(0.08, bodyR), segments: 3 });
    const ov = Math.max(0.06, Math.min(0.45, r.corniceOverhang));
    if (flat) {
        c.slab('trim', 'ledge', W + 0.1, 0.12, D + 0.1, 0, eave + 0.02, 0, { r: 0.05, b: Math.min(0.06, bodyR), segments: 3 });
    }
    else {
        for (const y of floorBases)
            c.slab('trim', 'band', W + 0.14, 0.16, D + 0.14, 0, y, 0, { r: 0.06, b: 0.05, segments: 3 });
        c.slab('trim', 'band', W + ov, 0.14, D + ov, 0, eave - 0.12, 0, { r: 0.05, b: 0.04 });
        c.slab('trim', 'band', W + 2 * ov, 0.22, D + 1.5 * ov, 0, eave + 0.03, 0, { r: 0.08, b: 0.06 });
        // fake shadow under the cornice
        c.inFrame(front(), () => c.plate(wall, c.shade('brick', -0.2), rrectShape(W - 2 * bodyR, 0.32, 0.12, c.q), 0.006, 0.004, 0, 0, eave - 0.36, false));
    }
    // corners
    if (r.corners === 'quoins') {
        let k = 0;
        for (let y = 0.6; y < eave - 0.3; y += 0.34, k++) {
            const len = (k % 2 ? 0.34 : 0.56) + c.jit(0.04);
            for (const s of [-1, 1])
                c.slab('trim', c.shade('band', c.jit(0.05)), len, 0.27, len * 0.8, s * (hw - len / 2 + 0.05), y, D / 2 - (len * 0.8) / 2 + 0.05, { r: 0.05, b: 0.035 });
        }
    }
    else if (r.corners === 'pilaster') {
        for (const s of [-1, 1]) {
            c.slab('trim', 'band', 0.34, eave - 0.45, 0.34, s * (hw - 0.12), 0.42 + (eave - 0.45) / 2, D / 2 - 0.12, { r: 0.06, b: 0.05 });
            for (const y of floorBases)
                c.slab('trim', 'band', 0.46, 0.14, 0.46, s * (hw - 0.12), y - 0.1, D / 2 - 0.12, { r: 0.05 });
        }
    }
    if (r.drainpipe) {
        const s = c.chance(0.5) ? -1 : 1;
        const x = s * (hw + 0.09);
        const z = D / 2 - 0.35;
        c.cyl('trim', 'ledge', 0.055, eave - 0.1, 'y', x, eave / 2, z, 0.02);
        c.slab('trim', 'ledge', 0.2, 0.22, 0.2, x, eave - 0.18, z, { r: 0.05 });
        c.slab('trim', 'ledge', 0.16, 0.1, 0.26, x, 0.08, z + 0.06, { r: 0.04 });
        for (let y = 1; y < eave - 0.5; y += 1.1)
            c.slab('trim', 'ledge', 0.14, 0.06, 0.14, x, y, z, { b: 0.015 });
    }
    // ---------- front facade ----------
    c.face = front();
    const bays = Math.max(1, Math.round(r.bays));
    const bw = W / bays;
    const doorBay = Math.min(bays - 1, Math.max(0, r.ground.doorBay ?? Math.floor(bays / 2)));
    const bayU = (i, n) => -hw + (W / n) * (i + 0.5);
    const Hg = r.groundFloorHeight;
    const doorU = bayU(doorBay, bays);
    const sink = { set: (v) => (door = v.applyMatrix4(c.face)) };
    let doorW = 0.9;
    if (r.ground.kind === 'door') {
        const steps = Math.max(0, Math.min(3, Math.round(r.ground.steps)));
        for (let b = 0; b < bays; b++) {
            const u = bayU(b, bays);
            if (b === doorBay) {
                doorW = Math.min(bw * 0.52, modern ? 1.0 : 1.05);
                addDoor(c, u, doorW, Math.min(Hg * 0.62, 2.0) - steps * 0.08, { steps, arch: r.ground.doorArch, modern, neeNee: P.neeNee, doormat: P.doormat, fade: r.weathering > 0.5 ? (r.weathering - 0.5) * 0.9 : 0 }, sink);
            }
            else if (modern) {
                addWindow(c, u, Hg * 0.5, Math.min(bw * 0.78, 2.2), Hg * 0.62, win());
            }
            else {
                const o = win();
                addWindow(c, u, Hg * 0.54, Math.min(bw * 0.52, 0.95), Math.min(Hg * 0.5, 1.45), o);
                sills.push({ x: u, y: Hg * 0.54 - Math.min(Hg * 0.5, 1.45) / 2 - 0.1, z: 0.25 });
            }
        }
        // identity at the door
        if (r.identity === 'bank')
            addBankPortico(c, doorU, Hg, steps, r.signText);
        if (r.identity === 'municipality') {
            for (const s of [-1, 1])
                addCoatOfArms(c, doorU + s * (doorW / 2 + 0.75), Hg * 0.62, 1);
            if (r.signText) {
                c.slab('trim', 'trim', 2.2, 0.42, 0.1, doorU, Hg + 0.32, 0.05, { r: 0.1, b: 0.03 });
                c.signText(r.signText, 2.0, 0.3, doorU, Hg + 0.32, 0.105, c.shade('ledge', -0.3));
            }
        }
        if (r.identity === 'synergy')
            synergyLogo(c, doorU, Hg - 0.25 + (modern ? 0.35 : 0), 0.3, 0.12, '#d9b04a');
        if (r.identity === 'pub')
            addBeerSign(c, hw - 0.3, Hg + 0.1, 1.15);
    }
    else if (r.ground.kind === 'shop' || r.ground.kind === 'pub') {
        const top = Hg - 0.5;
        c.slab('trim', 'accent', W - 0.04, 0.46, 0.2, 0, top + 0.16, 0.1, { r: 0.06 });
        c.slab('trim', 'trim', W + 0.04, 0.1, 0.26, 0, top + 0.43, 0.13, { r: 0.04 });
        c.slab('trim', 'trim', W - 0.5, 0.3, 0.05, 0, top + 0.16, 0.22, { r: 0.1, rz: c.jit(0.015) });
        if (r.signText)
            c.signText(r.signText, W - 0.8, 0.24, 0, top + 0.16, 0.25, c.shade('accent', -0.35));
        for (let b = 0; b <= bays; b++) {
            const u = -hw + 0.11 + ((W - 0.22) * b) / bays;
            c.slab('trim', 'accent', 0.22, top, 0.2, u, top / 2, 0.1, { r: 0.05 });
            c.slab('trim', 'trim', 0.3, 0.12, 0.26, u, top - 0.06, 0.13, { r: 0.04 });
            c.slab('trim', 'trim', 0.3, 0.12, 0.26, u, 0.1, 0.13, { r: 0.04 });
        }
        let neonDone = false;
        for (let b = 0; b < bays; b++) {
            const u = bayU(b, bays);
            if (b === doorBay) {
                const dw = Math.min(bw - 0.42, 0.95);
                doorW = dw;
                const dh = top - 0.32;
                c.plate('glass', 'glass', rrectShape(dw, dh, 0.01, c.q), 0.02, 0.01, 0, u, dh / 2 + 0.05, false);
                c.slab('gloss', c.shade('accent', -0.3), dw, dh * 0.5, 0.08, u, dh * 0.25 + 0.05, 0.04, { r: 0.03 });
                const lit = r.ground.kind === 'pub' || c.chance(r.litFraction);
                c.slab(lit ? 'lit' : 'glass', lit ? 'lit' : 'glass', dw * 0.7, dh * 0.38, 0.02, u, dh * 0.72, 0.03, { b: 0, r: 0.02, smooth: false });
                c.ball('gloss', '#e0b04a', 0.05, u + dw * 0.32, dh * 0.5, 0.11);
                c.slab('trim', c.shade('accent', -0.3), dw + 0.16, 0.12, 0.14, u, dh + 0.1, 0.07, { r: 0.04 });
                door = new THREE.Vector3(u, 0, 0.9).applyMatrix4(c.face);
                if (r.ground.kind === 'pub') {
                    addLantern(c, u - dw / 2 - 0.3, Hg * 0.6);
                    addLantern(c, u + dw / 2 + 0.3, Hg * 0.6);
                }
            }
            else {
                c.slab('trim', 'accent', bw - 0.24, 0.5, 0.12, u, 0.35, 0.06, { r: 0.04 });
                const lit = r.ground.kind === 'pub' ? c.chance(Math.max(r.litFraction, 0.7)) : c.chance(r.litFraction);
                const wy = 0.65 + (top - 0.75) / 2;
                addWindow(c, u, wy, bw - 0.5, top - 0.9, { style: 'grid', arch: 'none', flower: false, shutters: false, lit, frame: 'accent', head: false, life: r.ground.kind === 'pub' ? null : pickLife() });
                if (r.identity === 'coffee' && !neonDone) {
                    addNeonCup(c, u, wy - 0.2, 0.06);
                    neonDone = true;
                }
            }
        }
        if (r.ground.awning)
            addAwning(c, W - 0.1, top - 0.02);
        if (r.identity === 'pub') {
            addBeerSign(c, hw - 0.3, Hg + 0.1, 1.15);
            addBeerMug(c, -hw + 0.55, top + 0.75, 0.42, 0.85);
        }
    }
    else {
        for (let b = 0; b < bays; b++) {
            const u = bayU(b, bays);
            const dw = bw - 0.45;
            const dh = Hg - 0.75;
            const planks = Math.max(3, Math.round(dw / 0.22));
            for (let p = 0; p < planks; p++) {
                c.slab('trim', c.shade('door', (c.rng() - 0.5) * 0.14), dw / planks - 0.02, dh + c.jit(0.04), 0.08, u - dw / 2 + (dw / planks) * (p + 0.5), dh / 2 + 0.42, 0.04, { r: 0.02, b: 0.015 });
            }
            const ang = Math.atan2(dh * 0.8, dw);
            c.slab('trim', c.shade('door', -0.25), Math.hypot(dw, dh * 0.8) - 0.2, 0.13, 0.05, u, dh / 2 + 0.42, 0.1, { rz: ang, b: 0.015 });
            for (const yy of [0.18, 0.82])
                c.slab('trim', c.shade('door', -0.25), dw, 0.13, 0.05, u, 0.42 + dh * yy, 0.1, { b: 0.015 });
            const ring = new THREE.Shape(rrectShape(dw + 0.3, dh + 0.3, 0.1, c.q).getPoints());
            ring.holes.push(new THREE.Path(rrectShape(dw, dh, 0.05, c.q).getPoints()));
            c.plate('trim', 'trim', ring, 0.18, 0.09, 0.035, u, dh / 2 + 0.42);
            if (b === doorBay)
                door = new THREE.Vector3(u, 0, 1.2).applyMatrix4(c.face);
        }
        if (r.ground.sign) {
            c.slab('trim', 'accent', W * 0.72, 0.56, 0.12, 0, Hg + 0.02, 0.18, { r: 0.16, rz: c.jit(0.02) });
            c.slab('trim', 'trim', W * 0.62, 0.36, 0.05, 0, Hg + 0.02, 0.25, { r: 0.1 });
            if (r.signText)
                c.signText(r.signText, W * 0.55, 0.28, 0, Hg + 0.02, 0.28, c.shade('accent', -0.3));
        }
        if (r.identity === 'brewery') {
            const side = doorU > 0 ? -1 : 1;
            addBarrel(c, doorU + side * (bw / 2 + 0.05), 0.5, 1.3);
            addCrateStack(c, doorU - side * (bw / 2 + 0.1), 0.45);
            c.inFrame(c.face.clone().multiply(new THREE.Matrix4().makeTranslation(-W * 0.36 - 0.15, Hg - 0.3, 0.35)), () => {
                c.cyl('trim', '#9a6234', 0.32, 0.6, 'x', 0, 0, 0, 0.08);
                for (const dx of [-0.2, 0.2])
                    c.torus('trim', '#4a4046', 0.33, 0.025, 'x', dx, 0, 0);
            });
        }
    }
    // ---------- upper floors with one focal slot ----------
    const ub = Math.max(1, Math.round(r.windows.upperBays ?? bays));
    const midBay = ub % 2 ? (ub - 1) / 2 : ub / 2 - (c.chance(0.5) ? 1 : 0);
    const g = gableLayout(r.gable.kind, hw, r.gable.height);
    const gableHasWindow = !!g.outline && r.gable.window && g.windowCentreY !== null;
    let slot = null;
    if (floors > 0) {
        switch (r.focal) {
            case 'bayWindow':
            case 'gableStone':
                slot = { floor: 0, bay: midBay };
                break;
            case 'balcony':
            case 'niche':
                slot = { floor: floors - 1, bay: midBay };
                break;
            case 'roundWindow':
                if (!gableHasWindow)
                    slot = { floor: floors - 1, bay: midBay };
                break;
            default:
                break;
        }
    }
    r.floorHeights.forEach((fh, i) => {
        const base = floorBases[i] ?? 0;
        const ww = modern ? Math.min((W / ub) * 0.78, 2.2) : Math.min((W / ub) * 0.5, 0.95);
        const wh = modern ? fh * 0.62 : Math.min(fh * 0.52, 1.4);
        for (let b = 0; b < ub; b++) {
            const u = bayU(b, ub);
            const yc = base + fh * 0.52;
            if (slot && slot.floor === i && slot.bay === b) {
                switch (r.focal) {
                    case 'bayWindow':
                        addBayWindow(c, u, base, fh, (W / ub) * 0.9, win());
                        break;
                    case 'gableStone':
                        addGableStone(c, u, yc);
                        break;
                    case 'balcony':
                        addBalcony(c, u, base, fh, Math.max(1.4, (W / ub) * 0.95), modern || flat, P.mattress, win());
                        break;
                    case 'niche':

            v = y;
        }
        uv[i * 2] = u;
        uv[i * 2 + 1] = v;
    }

const cache = new Map();
/** Cached per recipe content + owner colour + detail. Treat recipes as immutable. */
function getBuildingMeshes(recipe, ownerHex, detail = 'high') {
    const key = `${detail}|${ownerHex.toLowerCase()}|${JSON.stringify(recipe)}`;
    let m = cache.get(key);
    if (!m) {
        m = buildBuilding(recipe, ownerHex, detail);
        cache.set(key, m);
    }
    return m;
}
function clearBuildingCache() {
    cache.forEach((m) => {
        Object.values(m.geometries).forEach((g) => g?.dispose());
        m.movers.forEach((mv) => Object.values(mv.geometries).forEach((g) => g?.dispose()));
    });
    cache.clear();
}

const PUFFS = 6;
function moverAngle(m, t, impulse, mood) {
    const w = Math.PI * 2 * m.freq;
    let a = 0;
    switch (m.kind) {
        case 'swing':
            a = Math.sin(t * w + m.phase) * m.amp * (1 + 5 * impulse) + Math.sin(t * 7 + m.phase) * 0.12 * impulse;
            break;
        case 'wave':
            a = Math.sin(t * w + m.phase) * m.amp + Math.sin(t * w * 2.3 + m.phase) * m.amp * 0.35;
            break;
        case 'sway':
            a = Math.sin(t * w + m.phase) * m.amp * (1 + 2 * impulse);
            break;
        case 'flicker':
            a = 0;
            break;
    }
    if (m.tag === 'sign')
        a += (1 - mood) * 0.35;
    return a;
}
function flickerLevel(t, phase, mood) {
    const f = 0.88 + 0.08 * Math.sin(t * 13 + phase) * Math.sin(t * 7.3 + phase * 2) + (Math.sin(t * 3.1 + phase) > 0.985 ? -0.35 : 0);
    return Math.max(0.2, f * (0.55 + 0.45 * mood));
}
function puffState(t, k, phase) {
    const p = (t * 0.28 + k / PUFFS + phase) % 1;
    const s = (0.1 + 0.32 * p) * Math.sqrt(Math.max(0, 1 - p));
    return [Math.sin(p * 4 + phase * 6) * 0.15 + p * 0.35, p * 1.9, Math.cos(p * 3 + phase) * 0.1, s];
}
